<!DOCTYPE html>
<html>
<head>
    <title>Smita AI Assistant</title>
    <link rel="stylesheet" href="chatbot.css">
</head>

<body>

<div class="chat-box">

    <div class="chat-header">
        🤖 Smita AI Assistant
        <button onclick="closeChat()">×</button>
    </div>

    <div id="messages">
        <div class="bot">
            👋 Hi! I'm Smita's AI Assistant.
            <br><br>
            Ask me about her skills, projects,
            education or GitHub.
        </div>
    </div>

    <div class="input-box">
        <input id="input" placeholder="Ask me something...">
        <button onclick="send()">➤</button>
    </div>

</div>

<script src="chatbot.js"></script>

</body>
</html>
